<h4>Listado</h4>
<ul class="list-group">
  <li *ngFor="let item of characterList; 
   let i = index;
   let esPrimero=first;
   let esUltimo=last;
   let esPar =even;
   " class="list-group-item d-flex justify-content-between align-items-center" [ngClass]="{
    'list-group-item-success':esUltimo,
    'list-group-item-primary':esPar
    }">
    <div>
      <span class="text-primary">{{i+1}}.</span>
      <span> {{item.nombre}} - </span>
      <strong>Poder:</strong>
      <span> {{item.poder}}</span>
    </div>
    <button class="btn btn-danger" (click)="onDeletCharacter(i)">X</button>
  </li>
</ul>
