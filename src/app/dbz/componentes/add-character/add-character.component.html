<form class="row" (ngSubmit)="emitirCharacter()">
    <input type="text" name="nombre" [(ngModel)]="character.nombre" class="form-control mb-2" placeholder="Nombre">
    <input type="number" name="poder" [(ngModel)]="character.poder" class="form-control mb-2" placeholder="Poder">

    <button type="submit" class="btn btn-primary">
        Agregar
    </button>
</form>
<pre>
    {{character | json}}
</pre>
