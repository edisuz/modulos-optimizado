<h1>{{nombre}}</h1>

<dl>
    <td>Nombre:</td>
    <dd>{{nombre}}</dd>

    <td>Edad:</td>
    <dd>{{edad}}</dd>

    <td>Método:</td>
    <dd>{{getDescripcionHeroe()}}</dd>

    <td>Capitalizado:</td>
    <dd>{{capitalizarNombre}}</dd>
</dl>


<button *ngIf="nombre !== 'Spiderman'" (click)="cambiarNombre()" class="btn btn-primary mx-2">
    Cambiar nombre
</button>

<button *ngIf="edad !== 25" class="btn btn-primary" (click)="cambiarEdad()">
    Cambiar edad
</button>

<button (click)="resetForm()" class="btn btn-secondary ms-3">Reset</button>
